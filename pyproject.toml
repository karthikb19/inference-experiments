[project]
name = "inference-experiments"
version = "0.1.0"
description = "Experiments with downloading and running language models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=0.30.0",
    "pyarrow>=25.0.1,<26",
    "transformers>=4.51.0",
    "vllm>=0.29.0,<0.30",
]

[project.scripts]
mmlu-baseline = "inference_experiments.mmlu.cli:main"
serve-qwen3-8b = "inference_experiments.vllm_serve:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
